name: Generate 5000+ real electronics CSV from live Smartprix

on:
  push:
    paths:
      - .github/workflows/generate_electronics_dataset.yml
      - .github/scripts/scrape_electronics_2026_india.py
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Scrape live Smartprix India catalog
        run: |
          python .github/scripts/scrape_electronics_2026_india.py \
            --target 5000 \
            --output electronics_2026_india_5000plus.csv \
            --pause 0.35

      - name: Validate dataset
        run: |
          python - <<'PY'
          import csv
          from collections import Counter

          path = "electronics_2026_india_5000plus.csv"
          with open(path, encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          required = {"id","productname","brand","category","price","rating","release_year"}
          assert len(rows) >= 5000, len(rows)
          assert set(rows[0]) == required, rows[0].keys()
          assert all(r["productname"].strip() for r in rows)
          assert all(r["brand"].strip() for r in rows)
          assert all(r["category"].strip() for r in rows)
          assert all(float(r["price"]) > 0 for r in rows)
          assert all(0 <= float(r["rating"]) <= 5 for r in rows)

          years = [int(r["release_year"]) for r in rows if r["release_year"].strip()]
          assert all(2000 <= y <= 2026 for y in years)

          cats = Counter(r["category"] for r in rows)
          print("ROWS:", len(rows))
          print("RELEASE_YEAR_FILLED:", len(years))
          print("RELEASE_YEAR_MISSING:", len(rows)-len(years))
          print("TOP_CATEGORIES:", cats.most_common(20))
          print("FIRST_ROW:", rows[0])
          print("LAST_ROW:", rows[-1])
          PY

      - name: Commit corrected dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electronics_2026_india_5000plus.csv
          git commit -m "Add corrected live Smartprix 2026 electronics dataset" || echo "No dataset changes to commit"
          git push

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: electronics-2026-india-5000plus
          path: electronics_2026_india_5000plus.csv
          retention-days: 30
