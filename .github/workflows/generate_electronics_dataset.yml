name: Generate 5000+ real electronics CSV from Smartprix India

on:
  # Manual execution prevents code edits from launching expensive scrapes.
  workflow_dispatch:

concurrency:
  group: electronics-dataset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-dataset:
    runs-on: ubuntu-latest
    # One runner instead of six parallel shards to cut total Actions-minute usage.
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Validate scraper syntax
        run: python -m py_compile .github/scripts/smartprix_electronics_scraper.py

      - name: Scrape one cross-category dataset
        run: |
          python .github/scripts/smartprix_electronics_scraper.py \
            --target 5500 \
            --output electronics_2026_india_5000plus.csv \
            --pause 0.6 \
            --shard 0 \
            --shards 1 \
            --mrp-verification-limit 50

      - name: Validate and summarize dataset
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from datetime import datetime, timezone

          path = "electronics_2026_india_5000plus.csv"
          expected_columns = [
              "id", "productname", "brand", "category", "price", "rating", "release_year",
              "currency", "rating_count", "release_year_source", "product_url", "source",
              "scraped_at", "mrp", "selling_price", "discount_amount", "discount_percent",
              "mrp_source", "mrp_source_type", "mrp_verified_at",
          ]
          with open(path, encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              if reader.fieldnames != expected_columns:
                  raise SystemExit(f"Unexpected CSV columns: {reader.fieldnames}")
              rows = list(reader)

          if len(rows) < 5000:
              raise SystemExit(f"Only {len(rows)} rows; at least 5,000 unique rows required.")
          keys = [(r["productname"].casefold().strip(), r["brand"].casefold().strip()) for r in rows]
          if len(set(keys)) != len(keys):
              raise SystemExit(f"Duplicate product-name/brand keys found: {len(keys) - len(set(keys))}")
          if not all(r["productname"].strip() and r["brand"].strip() and r["category"].strip() for r in rows):
              raise SystemExit("Blank product name, brand, or category found.")
          if not all(r["currency"] == "INR" for r in rows):
              raise SystemExit("Unexpected currency; dataset is intended to use INR.")
          if not all(float(r["price"]) > 0 for r in rows):
              raise SystemExit("Invalid selling price.")
          if not all(not r["mrp"].strip() or float(r["mrp"]) >= float(r["price"]) for r in rows):
              raise SystemExit("MRP must not be below the observed selling price.")
          if not all(not r["mrp"].strip() or (r["mrp_source"].strip() and r["mrp_source_type"].strip()) for r in rows):
              raise SystemExit("Every populated MRP needs a source URL and source type.")
          if not all(not r["discount_percent"].strip() or 0 <= float(r["discount_percent"]) <= 100 for r in rows):
              raise SystemExit("Invalid discount percentage.")
          if not all(not r["rating"].strip() or 0 <= float(r["rating"]) <= 5 for r in rows):
              raise SystemExit("Rating outside 0–5.")
          current_year = datetime.now(timezone.utc).year
          years = [int(r["release_year"]) for r in rows if r["release_year"].strip()]
          if not all(2000 <= y <= current_year for y in years):
              raise SystemExit("Release year outside accepted range.")
          print("ROWS:", len(rows))
          print("BRANDS:", len({r["brand"] for r in rows}))
          print("CATEGORIES:", Counter(r["category"] for r in rows).most_common())
          print("RELEASE_YEAR_FILLED:", len(years))
          print("MRP_FILLED:", sum(bool(r["mrp"].strip()) for r in rows))
          print("MRP_MISSING:", sum(not r["mrp"].strip() for r in rows))
          print("MRP_SOURCE_TYPES:", Counter(r["mrp_source_type"] for r in rows if r["mrp"].strip()))
          print("CURRENCY:", Counter(r["currency"] for r in rows))
          print("COLUMNS:", expected_columns)
          PY

      - name: Upload validated CSV
        uses: actions/upload-artifact@v4
        with:
          name: electronics-2026-india-5000plus
          path: electronics_2026_india_5000plus.csv
          if-no-files-found: error
          retention-days: 30

      - name: Commit dataset (retry safe push)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp electronics_2026_india_5000plus.csv /tmp/electronics_2026_india_5000plus.csv

          for attempt in 1 2 3 4 5; do
            echo "Publishing dataset, attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/electronics_2026_india_5000plus.csv electronics_2026_india_5000plus.csv
            git add electronics_2026_india_5000plus.csv

            if git diff --cached --quiet; then
              echo "Dataset is already up to date on main."
              exit 0
            fi

            git commit -m "Refresh Smartprix India electronics dashboard dataset"
            if git push origin HEAD:main; then
              echo "Dataset published successfully."
              exit 0
            fi
            echo "Push race detected; retrying latest main."
            sleep $((attempt * 3))
          done
          echo "Failed to publish dataset after five attempts." >&2
          exit 1
